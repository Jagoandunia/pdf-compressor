name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt tkinterdnd2

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all tkinterdnd2 --paths src --name "Kompresor-PDF-Ringan" src/app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kompresor-PDF-Ringan-Windows
          path: dist/Kompresor-PDF-Ringan.exe
