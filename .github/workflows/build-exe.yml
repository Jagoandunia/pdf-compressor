name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UPX compressor
        run: choco install upx -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt -r requirements-build.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm Kompresor-PDF-Ringan.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kompresor-PDF-Ringan-Windows
          path: dist/Kompresor-PDF-Ringan.exe
